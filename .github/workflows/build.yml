name: Build Bird Hat

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.11", "26.1.2"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build for Minecraft ${{ matrix.mc }}
        working-directory: birdhat-${{ matrix.mc }}
        run: gradle build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: birdhat-${{ matrix.mc }}
          path: |
            birdhat-${{ matrix.mc }}/build/libs/*.jar
            !birdhat-${{ matrix.mc }}/build/libs/*-sources.jar
